[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orbitval"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "skyfield",
    "astropy",
    "numpy",
    "pyyaml",
    "reportlab",
]

[project.scripts]
orbitval = "orbitval.cli:main"

[tool.setuptools.packages.find]
include = ["orbitval*"]