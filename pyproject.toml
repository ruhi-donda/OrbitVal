[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orbitval"
dynamic = ["version"]
description = "Local-first CubeSat autonomy stress testing — fault injection, orbit propagation, and cryptographically verifiable ORF reports."
readme = "README.md"
license = { text = "MIT" }
# 3.10 is the real floor: the codebase uses PEP 604 unions (str | Path) in
# signatures that are evaluated at runtime, which 3.9 cannot parse.
requires-python = ">=3.10"
dependencies = [
    "skyfield>=1.45",
    "astropy>=5.0",
    "numpy>=1.22",
    "pyyaml>=6.0",
    "reportlab>=3.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
# Detector-validation mode (orbitval/ml). Kept out of the core install:
# OrbitVal itself never imports torch or streamlit.
ml = [
    "torch>=2.2",
    "streamlit>=1.35",
    "matplotlib>=3.7",
]

[project.scripts]
orbitval = "orbitval.cli:main"

[tool.setuptools.dynamic]
version = { attr = "orbitval._version.__version__" }

[tool.setuptools.packages.find]
include = ["orbitval*"]

[tool.pytest.ini_options]
# testpaths keeps a bare `pytest` off the root-level test_orbit.py scratch
# script, which is not a test module and would hit the network.
testpaths = ["tests"]
filterwarnings = [
    "error::DeprecationWarning:orbitval.*",
]
